services:
  backend:
    build: .
    ports:
      - "8765:8765"
    environment:
      PYDANTIC_DISABLE_PLUGINS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
